{% extends 'mailings/base.html' %}

{% block title %}Сообщения{% endblock %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1>Список ваших сообщений</h1>
    <a class="btn btn-outline-light me-2" href="/message/create/">Добавить сообщение</a>
</div>
<div class="row px-5 py-3 pb-md-4">
    {% for message in object_list %}
    Тема письма: {{ message.subject }}
    <a href="/message/{{ message.id }}">
        <button type="button" class="btn row btn-lg btn-block btn-outline-info btn-sm">Подробнее</button>
    </a>
    {% endfor %}
</div>
{% endblock %}
