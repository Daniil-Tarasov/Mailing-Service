{% extends 'mailings/base.html' %}

{% block title %}Клиент {{ object.full_name }}{% endblock %}

{% block content %}
<p>Email: {{ object.email }} </p>
<p>Ф.И.О.: {{ object.full_name }}</p>
<p>Комментарий: {{ object.comment|default:"-" }}</p>
<div class="row">
    <a class="link" href="/mailing_recipient/{{ object.id }}/update/">Редактировать</a>
    <a class="link" href="/mailing_recipient/{{ object.id }}/delete/">Удалить</a>
</div>
{% endblock %}
