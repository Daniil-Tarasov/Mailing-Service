[tool.poetry]
name = "mailing-service"
version = "0.1.0"
description = ""
authors = ["Daniil Tarasov <danya.tarasov.01@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1.7"
python-dotenv = "^1.0.1"
psycopg2-binary = "^2.9.10"
ipython = "^9.0.2"
pillow = "^11.1.0"
django-phonenumber-field = {extras = ["phonenumberslite"], version = "^8.0.0"}


[tool.poetry.group.lint.dependencies]
flake8 = "^7.2.0"
black = "^25.1.0"
isort = "^6.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '.git'

[tool.isort]
line_length = 119
